services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-freelanceradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      ENVIRONMENT: production
      BOT_REPLICAS: "1"
      RADAR_V2_ENABLED: "true"
      # Supply a URL-encoded DSN explicitly. Compose cannot safely encode
      # reserved URI characters from POSTGRES_PASSWORD.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL with URL-encoded credentials is required}
      REDIS_URL: redis://redis:6379/0
      PTB_STATE_DIR: /app/data
      DATA_DIR: /app/data
    volumes:
      - botdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  pgdata:
  redisdata:
  botdata:
