name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  BOT_TOKEN: test
  OWNER_CHAT_ID: 123456789
  OPENAI_API_KEY: test
  TELEGRAM_API_ID: 12345
  TELEGRAM_API_HASH: test_hash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic pydantic-settings
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy --ignore-missing-imports .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: freelanceradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d freelanceradar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://radar:test-only@localhost:5432/freelanceradar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  test-postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: freelanceradar_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d freelanceradar_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://radar:test-only@localhost:5432/freelanceradar_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run PostgreSQL smoke test
        run: pytest tests/integration/test_postgres_smoke.py -v --tb=short

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term --cov-fail-under=70
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, test-postgres-smoke, test-coverage, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t freelance-radar:${{ github.sha }} .
      - name: Test Docker image
        run: docker run --rm freelance-radar:${{ github.sha }} python -c "print('OK')"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Run security audit
        run: pip-audit -r requirements.txt
