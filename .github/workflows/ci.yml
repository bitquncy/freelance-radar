name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic pydantic-settings
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy --ignore-missing-imports .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          BOT_TOKEN: test
          OWNER_CHAT_ID: 123456789
          OPENAI_API_KEY: test
          TELEGRAM_API_ID: 12345
          TELEGRAM_API_HASH: test_hash

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term
        env:
          BOT_TOKEN: test
          OWNER_CHAT_ID: 123456789
          OPENAI_API_KEY: test
          TELEGRAM_API_ID: 12345
          TELEGRAM_API_HASH: test_hash
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t freelance-radar:${{ github.sha }} .
      - name: Test Docker image
        run: docker run --rm freelance-radar:${{ github.sha }} python -c "print('OK')"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Run security audit
        run: pip-audit -r requirements.txt || true
