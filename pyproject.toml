[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["bot", "services", "parsers", "db", "config"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# Tests and helper scripts are not part of the type-gated surface.
exclude = '(^|/)(tests|scripts)/'

# Gradual typing: the V2 layer (core/, monitoring/, bot/handlers/v2/) is
# fully typed and gated strictly. The legacy single-owner bot carries
# ~900 pre-existing annotation gaps (documented debt in
# docs/V2_IMPLEMENTATION.md); it is excluded from error-gating so that
# `mypy --ignore-missing-imports .` — the CI lint step — passes without
# weakening checks on the new code.
[[tool.mypy.overrides]]
module = [
    "bot",
    "bot.auth",
    "bot.commands",
    "bot.keyboards",
    "bot.middleware",
    "bot.handlers",
    "bot.handlers.broadcast_handler",
    "bot.handlers.jobs_handler",
    "bot.handlers.kwork_filters_handler",
    "bot.handlers.profile_handler",
    "bot.handlers.settings_handler",
    "bot.handlers.sources_handler",
    "bot.handlers.tg_analysis_handler",
    "services.*",
    "parsers.*",
    "db.*",
    "config",
    "constants",
    "main",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.flake8]
max-line-length = 127
ignore = ["E501", "W503"]
exclude = [".git", "__pycache__", "venv", ".pytest_cache", "node_modules"]
